spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3309/notification}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # o schema é responsabilidade do Flyway
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  # Para o Mailpit local não precisa de login nem TLS.
  # Em produção defina SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD e as
  # propriedades de TLS por variáveis de ambiente.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  mail:
    from: ${MAIL_FROM:no-reply@notification.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
