name: notification-part2-smoke
services:
  console:
    image: notification-console:part2
  proxy:
    image: caddy:2
    ports: ["127.0.0.1:14201:8080"]
    volumes: ["./Caddyfile.smoke:/etc/caddy/Caddyfile:ro"]
    depends_on:
      app:
        condition: service_healthy
      console:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: notification_smoke
      MYSQL_USER: smoke
      MYSQL_PASSWORD: smoke-test-only
      MYSQL_ROOT_PASSWORD: smoke-root-test-only
      TZ: UTC
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 2s
      timeout: 3s
      retries: 40
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: smoke
      RABBITMQ_DEFAULT_PASS: smoke-test-only
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:18025:8025"]
  app:
    image: notification-service:part2
    environment:
      DB_URL: jdbc:mysql://mysql:3306/notification_smoke
      DB_USER: smoke
      DB_PASSWORD: smoke-test-only
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: smoke
      SPRING_RABBITMQ_PASSWORD: smoke-test-only
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      ADMIN_TOKEN: smoke-admin-test-only
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: SmokePassword123!
      SWAGGER_ENABLED: 'true'
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/actuator/health]
      interval: 3s
      timeout: 3s
      retries: 30
